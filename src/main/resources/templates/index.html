<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Footsy</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
   <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            <img th:src="@{/img/logo.jpg}"
                 alt="Footsy"
                 class="logo">
        </a>
        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/productos">Productos</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<!-- HERO -->
<!-- HERO -->
<section class="bg-primary text-white py-5">
    <div class="container text-center">

        <h1 class="display-4 fw-bold">
            Bienvenido a Footsy
        </h1>

        <p class="lead mb-4">
            Encuentra el calzado perfecto para cada ocasión.
        </p>

        <a th:href="@{/productos/nuevo}"
           class="btn btn-light btn-lg px-4">
            <i class="bi bi-plus-circle"></i>
            Crear producto
        </a>

    </div>
</section>
<!-- PRODUCTOS -->
<div class="container py-5">

    <h2 class="text-center mb-5 fw-bold">
        Productos registrados
    </h2>

    <div class="row g-4">

        <div class="col-md-6 col-lg-3"
             th:each="producto : ${productos}">

            <div class="card-product h-100">

                <!-- Imagen -->
                <img class="product-image"
                     th:src="@{'/img/' + ${producto.urlImagen}}"
                     alt="Producto">

                <!-- Contenido -->
                <div class="card-body">

                    <h5 class="card-title"
                        th:text="${producto.nombre}">
                        Nombre
                    </h5>

                    <p class="product-code"
                       th:text="${producto.codigo}">
                        Código
                    </p>

                    <p class="card-text"
                       th:text="${producto.descripcion}">
                        Descripción
                    </p>

                    <div class="product-info">

                        <span class="info-pill">
                            Talla:
                            <span th:text="${producto.infoTallas}">
                                EU42
                            </span>
                        </span>

                        <span class="info-pill">
                              Peso:
                            <span th:text="${producto.peso}">
                                850 g
                            </span>
                        </span>

                    </div>
                    <div class="d-grid gap-2 mt-3">

                        <a th:href="@{/productos/detalle/{id}(id=${producto.id})}"
                           class="btn btn-dark w-100">
                            <i class="bi bi-eye"></i>
                            Ver detalle
                        </a>


                        <a th:href="@{/productos/editar/{id}(id=${producto.id})}"
                           class="btn btn-outline-primary">
                            <i class="bi bi-pencil-square"></i>
                            Editar
                        </a>

                        <a th:href="@{/productos/eliminar/{id}(id=${producto.id})}"
                           class="btn btn-outline-danger"
                           onclick="return confirm('¿Deseas eliminar este producto?');">
                            <i class="bi bi-trash"></i>
                            Eliminar
                        </a>

                    </div>

                </div>

                <!-- Footer -->
                <div class="card-footer">

                    <span class="price"
                          th:text="'$ ' + ${producto.precioVenta}">
                        $129.99
                    </span>

                    <span class="badge bg-success"
                          th:text="${producto.estadoActivo} ? 'Activo' : 'Inactivo'">
                        Activo
                    </span>

                </div>

            </div>

        </div>

    </div>

</div>
<footer class="bg-dark text-white text-center py-4">
    © 2026 Footsy
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
